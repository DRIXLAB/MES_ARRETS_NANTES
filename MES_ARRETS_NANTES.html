                if (index === -1 || newIndex < 0 || newIndex >= AppState.selectedStops.length) return;
                const stops = AppState.selectedStops;
                [stops[index], stops[newIndex]] = [stops[newIndex], stops[index]];
                StorageManager.save();
                this.updateTransportWidgets();
                document.querySelector(`.widget[data-stop-code="${stopCode}"] .drag-handle`)?.focus();
            }

            // ---------- Affichage des passages ----------

            displayStopData(stopCode, data) {
                const container = document.getElementById(`content-${stopCode}`);
                if (!container) return;

                // Passages déjà partis : écartés (ils ne doivent pas occuper les lignes affichées)
                const upcoming = Array.isArray(data)
                    ? data.filter(bus => bus && (bus.line || bus.destination) && this.isUpcoming(bus))
                    : [];
                if (upcoming.length === 0) {
                    this.setContent(container, '<div class="error">Aucun passage prévu</div>');
                    return;
                }

                const { filters, autoHiddenDestinations } = this.getFilterContext(stopCode, data);

                const filteredData = upcoming.filter(bus => {
                    const ligne = this.getLigne(bus);
                    const terminus = this.getTerminus(bus);
                    if (filters.hiddenLines.includes(ligne)) return false;
                    if (filters.hiddenDestinations.includes(terminus)) return false;
                    if (autoHiddenDestinations.has(terminus)) return false;
                    return true;
                }).slice(0, CONFIG.MAX_ROWS);

                if (filteredData.length === 0) {
                    this.setContent(container, '<div class="error">Aucun passage après filtrage</div>');
                    return;
                }

                const rows = filteredData.map(bus => {
                    const ligne = this.getLigne(bus);
                    const hue = this.getLineHue(ligne);
                    const delay = this.getDelayMin(bus);
                    const timeHtml = bus.cancelled
                        ? '<span class="status-cancelled">Supprimé</span>'
                        : `${Utils.escapeHtml(this.getTemps(bus))}${delay >= CONFIG.MIN_DELAY_DISPLAYED ? ` <span class="delay" title="Retard par rapport à l'horaire théorique">+${delay} min</span>` : ''}`;
                    return `
                        <tr class="${bus.cancelled ? 'cancelled' : ''}">
                            <td><span class="line-badge" style="background: hsla(${hue}, 85%, 55%, 0.18); color: hsl(${hue}, 85%, 65%); border: 1px solid hsla(${hue}, 85%, 55%, 0.4);">${Utils.escapeHtml(ligne)}</span></td>
                            <td class="direction-cell">${Utils.escapeHtml(this.getTerminus(bus))}</td>
                            <td>${timeHtml}</td>
                        </tr>
                    `;
                }).join('');

                this.setContent(container, `
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Ligne</th>
                                <th>Direction</th>
                                <th>Temps</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                `);
            }

            getLineHue(ligne) {
                let hash = 0;
                for (let i = 0; i < ligne.length; i++) {
                    hash = ligne.charCodeAt(i) + ((hash << 5) - hash);
                }
                return Math.abs(hash) % 360;
            }

            getLigne(bus) {
                return bus.line || 'N/A';
            }

            getTerminus(bus) {
                return bus.destination || 'Direction inconnue';
            }

            // Horodatage en ms (`expected` ou `aimed`), NaN si absent ou invalide.
            // Les caches enregistrés avant l'ajout des champs *Ms sont relus depuis le texte.
            timeMs(bus, which) {
                const ms = bus[`${which}Ms`];
                return Number.isFinite(ms) ? ms : Date.parse(bus[`${which}Time`]);
            }

            // Clé de tri : les heures illisibles passent en dernier
            sortKey(bus) {
                const ms = this.timeMs(bus, 'expected');
                return Number.isNaN(ms) ? Number.MAX_SAFE_INTEGER : ms;
            }

            // Minutes avant le passage (arrondi), ou null si l'heure est inconnue
            minutesUntil(bus) {
                const ms = this.timeMs(bus, 'expected');
                return Number.isNaN(ms) ? null : Math.round((ms - Date.now()) / 60000);
            }

            isUpcoming(bus) {
                const minutes = this.minutesUntil(bus);
                return minutes === null || minutes >= 0;
            }

            // Retard en minutes (heure prévue - heure théorique), 0 si inconnu
            getDelayMin(bus) {
                const delay = Math.round((this.timeMs(bus, 'expected') - this.timeMs(bus, 'aimed')) / 60000);
                return Number.isNaN(delay) ? 0 : delay;
            }

            getTemps(bus) {
                const minutes = this.minutesUntil(bus);
                if (minutes === null) return 'N/A';
                if (minutes <= 0) return 'Proche';
                if (minutes < 60) return `${minutes} min`;
                return Utils.formatHourMinute(new Date(this.timeMs(bus, 'expected')));
            }

            destroy() {
                this.stopCountdown();
                document.removeEventListener('visibilitychange', this.onVisibilityChange);
                if (this.displayInterval) {
                    clearInterval(this.displayInterval);
                    this.displayInterval = null;
                }
            }
        }

        class DashboardApp {
            constructor() {
                this.timeManager = null;
                this.stopManager = null;
                this.transportManager = null;
            }

            init() {
                try {
                    const saved = StorageManager.load();
                    this.timeManager = new TimeManager();
                    this.transportManager = new TransportManager(saved || {});
                    StorageManager.attach(this.transportManager);
                    this.stopManager = new StopManager(this.transportManager);
                    this.transportManager.onSelectionChange = () => this.stopManager.renderStopSelector();
                    // Exposés pour le débogage depuis la console
                    window.transportManager = this.transportManager;
                    window.stopManager = this.stopManager;
                    this.transportManager.start();
                } catch (error) {
                    console.error('Erreur initialisation dashboard:', error);
                }
            }

            destroy() {
                this.timeManager?.destroy();
                this.transportManager?.destroy();
            }
        }

        let app;
        document.addEventListener('DOMContentLoaded', () => {
            app = new DashboardApp();
            app.init();
        });

        window.addEventListener('pagehide', () => {
            app?.destroy();
        });
    </script>
</body>
</html>
