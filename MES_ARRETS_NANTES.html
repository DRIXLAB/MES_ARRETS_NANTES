    <style>
        /* Police Inter (variable, sous-ensemble latin) hébergée dans vendor/inter */
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-display: swap;
            font-weight: 100 900;
            src: url('vendor/inter/inter-latin-wght-normal.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        :root {
            --primary-bg: linear-gradient(135deg, #0f0f23, #1a1a2e, #16213e);
            --widget-bg: rgba(255, 255, 255, 0.05);
            --widget-hover: rgba(255, 255, 255, 0.1);
            --accent-color: #00f5ff;
            --accent-secondary: #ff6b6b;
            --text-color: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --hover-bg: rgba(0, 245, 255, 0.1);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            --border-radius: 16px;
            --spacing: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--primary-bg);
            background-attachment: fixed;
            color: var(--text-color);
            min-height: 100vh;
            padding: var(--spacing);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            line-height: 1.6;
        }

        .header-widgets {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
            margin-bottom: calc(var(--spacing) * 1.5);
        }

        .header-widgets .base-widget {
            width: 100%;
        }

        .base-widget {
            background: var(--widget-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--glass-shadow);
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .base-widget::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .base-widget:hover {
            transform: translateY(-4px);
            background: var(--widget-hover);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
        }

        .base-widget:hover::before {
            opacity: 1;
        }

        .datetime-calendar-widget {
            font-weight: 300;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 24px;
            align-items: center;
            padding: 8px 20px !important;
        }

        .datetime-calendar-widget .datetime-section {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 20px;
        }

        .datetime-calendar-widget .date-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .datetime-calendar-widget .day {
            font-size: 2.2em;
            line-height: 0.9;
            font-weight: 100;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .datetime-calendar-widget .month {
            font-size: 0.75em;
            color: var(--text-secondary);
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 500;
        }

        .datetime-calendar-widget .time-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            border-left: 1px solid var(--border-color);
            padding-left: 20px;
        }

        .datetime-calendar-widget .digital-time {
            font-size: 1.6em;
            font-weight: 100;
            background: linear-gradient(135deg, var(--accent-color), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            letter-spacing: 0.05em;
        }

        .datetime-calendar-widget .time-label {
            font-size: 0.6em;
            color: var(--text-secondary);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 500;
        }

        .datetime-calendar-widget .calendar-section {
            border-left: 1px solid var(--border-color);
            padding-left: 24px;
        }

        .calendar-widget {
            font-size: 0.7em;
        }

        .calendar-header {
            font-weight: 600;
            margin-bottom: 2px;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-size: 0.8em;
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            margin-bottom: 1px;
            text-align: center;
        }

        .calendar-weekday {
            color: var(--text-secondary);
            font-size: 0.7em;
            font-weight: 500;
            padding: 0 2px;
        }

        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0 2px;
            text-align: center;
        }

        .calendar-day {
            padding: 1px 2px;
            line-height: 1.3;
            border-radius: 4px;
            transition: var(--transition);
            font-weight: 400;
        }

        .calendar-day:hover {
            background: var(--hover-bg);
        }

        .current-day {
            background: linear-gradient(135deg, var(--accent-color), var(--accent-secondary));
            color: #0f0f23;
            font-weight: 600;
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(0, 245, 255, 0.3);
        }

        .main-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: var(--spacing);
        }

        .config-section {
            background: var(--widget-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--glass-shadow);
            margin-bottom: var(--spacing);
        }

        .config-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .config-title {
            font-size: 1.2em;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent-color), var(--text-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .config-button {
            background: linear-gradient(135deg, var(--accent-color), var(--accent-secondary));
            color: #0f0f23;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9em;
        }

        .config-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 245, 255, 0.4);
        }

        .search-container {
            margin-bottom: 16px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 0.95em;
            font-family: inherit;
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 3px rgba(0, 245, 255, 0.1);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .stop-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .stop-selector::-webkit-scrollbar {
            width: 8px;
        }

        .stop-selector::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .stop-selector::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 4px;
        }

        .stop-item {
            content-visibility: auto;
            contain-intrinsic-size: auto 44px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: var(--widget-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
        }

        .stop-item:hover {
            background: var(--widget-hover);
            border-color: var(--accent-color);
        }

        .stop-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        .stop-item label {
            cursor: pointer;
            flex: 1;
            font-size: 0.9em;
        }

        .stop-item .stop-suffix {
            color: var(--text-secondary);
        }

        .transport-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: var(--spacing);
        }

        .widget {
            background: var(--widget-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 16px;
            box-shadow: var(--glass-shadow);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .widget.is-new {
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .widget.dragging {
            opacity: 0.5;
            transform: scale(0.95);
        }

        .widget.drag-over {
            border-color: var(--accent-color);
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
        }

        .widget::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-color), var(--accent-secondary));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .widget:hover {
            transform: translateY(-6px);
            background: var(--widget-hover);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .widget:hover::before {
            transform: scaleX(1);
        }

        .widget-header {
            margin: 0 0 14px 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            text-align: center;
            font-size: 1.1em;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .widget-header .drag-handle {
            cursor: move;
            touch-action: none; /* évite le défilement de la page pendant le glisser tactile */
            color: var(--accent-color);
            font-size: 1.3em;
            padding: 4px 8px;
            transition: var(--transition);
            opacity: 0.7;
            flex-shrink: 0;
        }

        .widget-header .drag-handle:hover {
            color: var(--accent-color);
            opacity: 1;
            transform: scale(1.15);
        }

        .widget-header .drag-handle:active {
            cursor: grabbing;
        }

        .widget-header .drag-handle i {
            color: inherit;
            margin: 0;
        }

        .widget-header .title {
            flex: 1;
            text-align: center;
            font-size: inherit;
            font-weight: inherit;
            letter-spacing: inherit;
            background: linear-gradient(135deg, var(--accent-color), var(--text-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stop-suffix {
            font-size: 0.7em;
            font-weight: 400;
            opacity: 0.8;
        }

        .widget-header .actions {
            display: flex;
            gap: 8px;
        }

        .widget-header i {
            margin-right: 6px;
            color: var(--accent-color);
        }

        .filter-button, .remove-button {
            background: rgba(0, 245, 255, 0.1);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8em;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .filter-button:hover, .remove-button:hover {
            background: rgba(0, 245, 255, 0.2);
            transform: scale(1.05);
        }

        .remove-button {
            background: rgba(255, 107, 107, 0.1);
            border-color: var(--accent-secondary);
            color: var(--accent-secondary);
        }

        .remove-button:hover {
            background: rgba(255, 107, 107, 0.2);
        }

        .filter-button.active {
            background: var(--accent-color);
            color: #0f0f23;
        }

        .filter-button.active i {
            color: inherit;
        }

        .filter-button i, .remove-button i {
            font-size: 0.9em;
        }

        .filter-panel {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            display: none;
        }

        .filter-panel.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .widget-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        .refresh-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 0 10px 0;
        }

        .refresh-button {
            background: rgba(0, 245, 255, 0.07);
            border: 1px solid rgba(0, 245, 255, 0.35);
            color: var(--accent-color);
            padding: 7px 16px;
            border-radius: 8px;
            cursor: default;
            font-size: 0.85em;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            opacity: 0.6;
        }

        .refresh-button.ready {
            opacity: 1;
            cursor: pointer;
            background: rgba(0, 245, 255, 0.14);
        }

        .refresh-button.ready:hover {
            background: rgba(0, 245, 255, 0.25);
            transform: scale(1.05);
        }

        .refresh-button.fetching i {
            animation: spin 0.8s linear infinite;
        }

        .filter-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .filter-panel-title {
            color: var(--text-color);
            font-size: 0.9em;
            font-weight: 600;
        }

        .reset-filters-button {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid var(--accent-secondary);
            color: var(--accent-secondary);
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75em;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .reset-filters-button:hover {
            background: rgba(255, 107, 107, 0.3);
            transform: scale(1.05);
        }

        .reset-filters-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .storage-info {
            background: rgba(0, 245, 255, 0.05);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 12px;
            font-size: 0.8em;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .storage-info i {
            color: var(--accent-color);
        }

        .clear-storage-button {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid var(--accent-secondary);
            color: var(--accent-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85em;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
        }

        .clear-storage-button:hover {
            background: rgba(255, 107, 107, 0.2);
            transform: translateY(-2px);
        }

        .filter-section {
            margin-bottom: 12px;
        }

        .filter-section:last-child {
            margin-bottom: 0;
        }

        .filter-section-title {
            color: var(--accent-color);
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .filter-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8em;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-tag:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-color);
        }

        .filter-tag.filtered {
            background: rgba(255, 107, 107, 0.2);
            border-color: var(--accent-secondary);
            opacity: 0.8;
        }

        .filter-tag.filtered span {
            text-decoration: line-through;
        }

        .filter-tag.auto-filtered {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .filter-tag.auto-filtered:hover {
            background: rgba(255, 107, 107, 0.2);
            border-color: var(--accent-secondary);
            transform: none;
        }

        .filter-tag i {
            font-size: 0.7em;
        }

        .filter-tag.line-tag {
            border-left-width: 3px;
        }

        .line-mini-badge {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.75em;
            line-height: 1.5;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th, .data-table td {
            padding: 8px 6px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85em;
            transition: var(--transition);
        }

        .data-table th {
            color: var(--accent-color);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.75em;
            background: rgba(0, 245, 255, 0.05);
        }

        .data-table tbody tr {
            transition: var(--transition);
        }

        .data-table tbody tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.02);
        }

        .data-table tbody tr:hover {
            background: var(--hover-bg);
            transform: translateX(4px);
        }

        .data-table tbody tr:hover td {
            color: var(--accent-color);
        }

        .line-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9em;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .loading, .error {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            font-size: 0.85em;
        }

        .loading {
            color: var(--text-secondary);
            font-style: italic;
            position: relative;
        }

        .loading::after {
            content: '';
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-color);
            border-top: 2px solid var(--accent-color);
            border-radius: 50%;
            margin-left: 10px;
            animation: spin 1s linear infinite;
        }

        .error {
            color: var(--accent-secondary);
            font-weight: 500;
            flex-direction: column;
            gap: 6px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .hidden {
            display: none;
        }

        /* Accessibilité */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        button:focus-visible,
        .drag-handle:focus-visible,
        .filter-tag:focus-visible,
        .stop-item input:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        /* Retards, suppressions, états vides */
        .data-table .delay {
            color: #ffb454;
            font-size: 0.8em;
            font-weight: 600;
            white-space: nowrap;
        }

        .data-table tr.cancelled .direction-cell {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .data-table .status-cancelled {
            color: var(--accent-secondary);
            font-weight: 700;
        }

        .error small {
            color: var(--text-secondary);
            font-weight: 400;
        }

        .filter-empty {
            color: var(--text-secondary);
            font-size: 0.8em;
            font-style: italic;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 768px) {
            .datetime-calendar-widget {
                grid-template-columns: 1fr !important;
                gap: 8px !important;
            }

            .datetime-calendar-widget .datetime-section {
                justify-content: center;
                text-align: center;
                padding-bottom: 8px;
                border-bottom: 1px solid var(--border-color);
            }

            .datetime-calendar-widget .date-section,
            .datetime-calendar-widget .time-section {
                align-items: center;
            }

            .datetime-calendar-widget .calendar-section {
                border-left: none;
                padding-left: 0;
            }

            .transport-grid {
                grid-template-columns: 1fr;
            }

            .stop-selector {
                grid-template-columns: 1fr;
            }

            .widget-header {
                flex-wrap: wrap;
            }

            .widget-header .actions {
                gap: 4px;
            }

            .filter-button, .remove-button {
                font-size: 0.7em;
                padding: 4px 8px;
            }

            .filter-button span, .remove-button span {
                display: none;
            }

            .filter-button i, .remove-button i {
                margin: 0;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <h1 class="sr-only">Prochains passages aux arrêts du réseau de Nantes</h1>
    <div class="header-widgets">
        <div class="base-widget datetime-calendar-widget">
            <div class="datetime-section">
                <div class="date-section">
                    <div class="day" id="day">-</div>
                    <div class="month" id="month">Chargement...</div>
                </div>
                <div class="time-section">
                    <time class="digital-time" id="digital-time">--:--:--</time>
                    <div class="time-label">Heure locale</div>
                </div>
            </div>
            
            <div class="calendar-section calendar-widget">
                <div class="calendar-header" id="calendar-month-year">Chargement...</div>
                <div class="calendar-weekdays">
                    <div class="calendar-weekday">L</div>
                    <div class="calendar-weekday">M</div>
                    <div class="calendar-weekday">M</div>
                    <div class="calendar-weekday">J</div>
                    <div class="calendar-weekday">V</div>
                    <div class="calendar-weekday">S</div>
                    <div class="calendar-weekday">D</div>
                </div>
                <div class="calendar-days" id="calendar-days"></div>
            </div>
        </div>
    </div>

    <main class="main-container">
        <section class="config-section">
            <div class="config-header">
                <h2 class="config-title"><i class="fas fa-cog"></i> Configuration des arrêts</h2>
                <button class="config-button" id="toggleConfig" aria-expanded="false" aria-controls="stopSelector">
                    <i class="fas fa-chevron-down" aria-hidden="true"></i> Configurer
                </button>
            </div>
            <div id="stopSelector" class="hidden">
                <div class="search-container">
                    <label for="searchInput" class="sr-only">Rechercher un arrêt</label>
                    <input type="search"
                           class="search-input"
                           id="searchInput"
                           autocomplete="off"
                           placeholder="Rechercher un arrêt...">
                </div>
                <div id="stopList" class="stop-selector"></div>
                <div class="storage-info">
                    <i class="fas fa-save"></i>
                    <span>Vos préférences sont sauvegardées automatiquement dans votre navigateur</span>
                </div>
                <button class="clear-storage-button" id="clearStorage">
                    <i class="fas fa-trash-alt"></i>
                    <span>Effacer toutes les données sauvegardées</span>
                </button>
            </div>
        </section>

        <div class="refresh-bar hidden" id="refreshBar">
            <button class="refresh-button" id="refreshBtn" type="button" disabled>
                <i class="fas fa-sync-alt"></i>
                <span id="refreshLabel">Chargement...</span>
            </button>
        </div>

        <section id="transportGrid" class="transport-grid"></section>
    </main>

    <script src="stops.js"></script>
    <script>
        'use strict';

        // STOP_LIST (données Naolib) est défini dans stops.js
        // Format : [nom, StopPlaceId, [quayIds...]]

        // Tables de lookup construites au démarrage
        const STOP_MAP = {};       // { placeId: { name, quays } }
        const QUAY_TO_PLACE = {};  // { quayId: placeId }
        const NAME_COUNT = new Map();  // nom d'arrêt -> nombre de lieux portant ce nom
        for (const [name, placeId, quays] of STOP_LIST) {
            STOP_MAP[placeId] = { name, quays };
            for (const q of quays) QUAY_TO_PLACE[q] = placeId;
            NAME_COUNT.set(name, (NAME_COUNT.get(name) || 0) + 1);
        }

        // Nom d'un arrêt ; `duplicate` est vrai si plusieurs lieux portent le même nom
        // (on affiche alors le numéro du lieu pour les distinguer)
        function stopInfo(code) {
            const stop = STOP_MAP[code];
            if (!stop) return { name: String(code), duplicate: false };
            return { name: stop.name, duplicate: NAME_COUNT.get(stop.name) > 1 };
        }

        const CONFIG = {
            REFRESH_INTERVALS: {
                CLOCK: 1000,
                DISPLAY: 1000
            },
            FETCH_COOLDOWN_S: 30,      // limite de l'API : 1 requête / 30 s pour tous les arrêts
            MIN_MANUAL_RETRY_MS: 5000, // délai minimal avant un réessai manuel après une erreur
            SEARCH_DEBOUNCE_MS: 120,   // délai de saisie avant de filtrer la liste d'arrêts
            MAX_ROWS: 10,              // passages affichés par arrêt
            MIN_DELAY_DISPLAYED: 2,    // retard (min) à partir duquel on l'affiche
            SIRI_ENDPOINT: 'https://api.okina.fr/gateway/sem/realtime/anshar/services',
            LOCALE: 'fr-FR',
            TIMEZONE: 'Europe/Paris',
            STORAGE_KEY: 'nantes-dashboard-config-v2'
        };

        const AppState = {
            availableStops: [],
            selectedStops: [],
            isConfigOpen: false,
            searchQuery: '',
            filters: {}
        };

        const StorageManager = {
            transport: null,

            // Le TransportManager fournit le cache des passages à sauvegarder
            attach(transportManager) {
                this.transport = transportManager;
            },

            save() {
                try {
                    const cached = this.transport?.cachedByStop || {};
                    const cachedData = {};
                    for (const code of AppState.selectedStops) {
                        if (cached[code]) cachedData[code] = cached[code];
                    }
                    const config = {
                        selectedStops: AppState.selectedStops,
                        filters: AppState.filters,
                        cachedData,
                        lastFetchTime: this.transport?.lastFetchTime || 0,
                        timestamp: new Date().toISOString()
                    };
                    localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(config));
                } catch (error) {
                    console.error('Erreur sauvegarde:', error);
                }
            },

            // Charge les arrêts et filtres dans AppState ; renvoie la config lue (ou null)
            load() {
                try {
                    const saved = localStorage.getItem(CONFIG.STORAGE_KEY);
                    if (saved) {
                        const config = JSON.parse(saved);
                        // Ne garder que des codes d'arrêts connus (données du navigateur non fiables)
                        const stops = Array.isArray(config.selectedStops) ? config.selectedStops.map(String) : [];
                        AppState.selectedStops = [...new Set(stops.filter(code => STOP_MAP[code]))];
                        AppState.filters = {};
                        for (const code of AppState.selectedStops) {
                            const f = config.filters?.[code];
                            AppState.filters[code] = {
                                hiddenLines: Array.isArray(f?.hiddenLines) ? f.hiddenLines.map(String) : [],
                                hiddenDestinations: Array.isArray(f?.hiddenDestinations) ? f.hiddenDestinations.map(String) : []
                            };
                        }
                        return config;
                    }
                } catch (error) {
                    console.error('Erreur chargement:', error);
                }
                return null;
            },

            clear() {
                try {
                    localStorage.removeItem(CONFIG.STORAGE_KEY);
                    AppState.selectedStops = [];
                    AppState.filters = {};
                    if (this.transport) this.transport.cachedByStop = {};
                    return true;
                } catch (error) {
                    console.error('Erreur effacement:', error);
                    return false;
                }
            }
        };

        // Formateurs créés une seule fois (leur création est coûteuse)
        const PARIS_TIME = new Intl.DateTimeFormat(CONFIG.LOCALE, {
            hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: CONFIG.TIMEZONE
        });
        const PARIS_HOUR_MINUTE = new Intl.DateTimeFormat(CONFIG.LOCALE, {
            hour: '2-digit', minute: '2-digit', timeZone: CONFIG.TIMEZONE
        });
        const PARIS_DATE = new Intl.DateTimeFormat('en-US', {
            year: 'numeric', month: 'numeric', day: 'numeric', timeZone: CONFIG.TIMEZONE
        });

        const Utils = {
            MONTHS: ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin',
                'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'],

            formatTime(date) {
                return PARIS_TIME.format(date);
            },

            formatHourMinute(date) {
                return PARIS_HOUR_MINUTE.format(date);
            },

            // Date du jour à Paris (comme l'horloge), quel que soit le fuseau de l'appareil
            parisDate(date) {
                const parts = {};
                for (const { type, value } of PARIS_DATE.formatToParts(date)) parts[type] = Number(value);
                return { year: parts.year, month: parts.month, day: parts.day };
            },

            // Minuscules, sans accents ni ponctuation : pour la recherche d'arrêts
            normalize(text) {
                return String(text).normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                    .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
            },

            // Sûr dans du texte ET dans des attributs HTML entre guillemets
            escapeHtml(text) {
                return String(text).replace(/[&<>"']/g, c => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                }[c]));
            },

            // Le délai couvre la requête ET la lecture du corps de la réponse
            async fetchText(url, options = {}, timeout = 15000) {
                const controller = new AbortController();
                const id = setTimeout(() => controller.abort(), timeout);
                try {
                    const response = await fetch(url, { ...options, signal: controller.signal });
                    const text = await response.text();
                    return { ok: response.ok, status: response.status, text };
                } finally {
                    clearTimeout(id);
                }
            },

            compareNatural(a, b) {
                return String(a).localeCompare(String(b), CONFIG.LOCALE, { numeric: true });
            }
        };

        class TimeManager {
            constructor() {
                this.lastDateKey = null;
                this.updateDateTime();
                this.intervalId = setInterval(() => this.updateDateTime(), CONFIG.REFRESH_INTERVALS.CLOCK);
            }

            updateDateTime() {
                const now = new Date();

                const timeElement = document.getElementById('digital-time');
                if (timeElement) timeElement.textContent = Utils.formatTime(now);

                // Date et calendrier d'après l'heure de Paris (comme l'horloge),
                // reconstruits uniquement quand le jour change
                const { year, month, day } = Utils.parisDate(now);
                const dateKey = `${year}-${month}-${day}`;
                if (dateKey === this.lastDateKey) return;
                this.lastDateKey = dateKey;

                const dayElement = document.getElementById('day');
                const monthElement = document.getElementById('month');
                if (dayElement) dayElement.textContent = day;
                if (monthElement) monthElement.textContent = Utils.MONTHS[month - 1].toUpperCase();

                this.updateCalendar(year, month, day);
            }

            updateCalendar(year, month, currentDay) {
                const headerElement = document.getElementById('calendar-month-year');
                if (headerElement) headerElement.textContent = `${Utils.MONTHS[month - 1]} ${year}`.toUpperCase();

                // Calcul en UTC : le calendrier ne dépend pas du fuseau de l'appareil
                const firstDay = new Date(Date.UTC(year, month - 1, 1)).getUTCDay();
                const daysInMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();

                let calendarHTML = '';
                const emptyDays = firstDay === 0 ? 6 : firstDay - 1;
                for (let i = 0; i < emptyDays; i++) calendarHTML += '<div class="calendar-day"></div>';
                for (let day = 1; day <= daysInMonth; day++) {
                    const isToday = day === currentDay;
                    calendarHTML += `<div class="calendar-day ${isToday ? 'current-day' : ''}">${day}</div>`;
                }

                const daysElement = document.getElementById('calendar-days');
                if (daysElement) daysElement.innerHTML = calendarHTML;
            }

            destroy() {
                if (this.intervalId) clearInterval(this.intervalId);
            }
        }

        class StopManager {
            constructor(transportManager) {
                this.transport = transportManager;
                this.searchTimer = null;
                // Liste des arrêts issue des données embarquées (pas d'API), triée une seule fois
                AppState.availableStops = STOP_LIST
                    .map(([name, placeId, quays]) => ({
                        codeLieu: String(placeId),
                        libelle: name,
                        quays,
                        duplicate: NAME_COUNT.get(name) > 1,
                        search: Utils.normalize(name)
                    }))
                    .sort((a, b) => a.libelle.toLowerCase().localeCompare(b.libelle.toLowerCase(), CONFIG.LOCALE));
                this.renderStopSelector();
                this.setupEventListeners();
            }

            renderStopSelector() {
                const container = document.getElementById('stopList');
                if (!container) return;

                const stops = this.filterStops();

                if (stops.length === 0) {
                    container.innerHTML = '<div class="error">Aucun arrêt trouvé</div>';
                    return;
                }

                const selected = new Set(AppState.selectedStops);
                container.innerHTML = stops.map(stop => `
                    <div class="stop-item">
                        <input type="checkbox"
                               id="stop-${stop.codeLieu}"
                               value="${stop.codeLieu}"
                               ${selected.has(stop.codeLieu) ? 'checked' : ''}>
                        <label for="stop-${stop.codeLieu}">${Utils.escapeHtml(stop.libelle)}${stop.duplicate ? ` <span class="stop-suffix">n° ${stop.codeLieu}</span>` : ''}</label>
                    </div>
                `).join('');
            }

            // Arrêts correspondant à la recherche (sans accents ni casse), sélectionnés en premier
            filterStops() {
                const query = Utils.normalize(AppState.searchQuery);
                const matching = query
                    ? AppState.availableStops.filter(stop => stop.search.includes(query))
                    : AppState.availableStops;
                const selected = new Set(AppState.selectedStops);
                return [
                    ...matching.filter(stop => selected.has(stop.codeLieu)),
                    ...matching.filter(stop => !selected.has(stop.codeLieu))
                ];
            }

            handleStopSelection(event) {
                const stopCode = event.target.value;
                if (event.target.checked) {
                    if (!AppState.selectedStops.includes(stopCode)) {
                        AppState.selectedStops.push(stopCode);
                    }
                } else {
                    AppState.selectedStops = AppState.selectedStops.filter(code => code !== stopCode);
                    this.transport.forgetStop(stopCode);
                }
                StorageManager.save();
                this.transport.updateTransportWidgets();
            }

            setupEventListeners() {
                const toggleButton = document.getElementById('toggleConfig');
                const selector = document.getElementById('stopSelector');
                const searchInput = document.getElementById('searchInput');
                const clearStorageButton = document.getElementById('clearStorage');
                const stopList = document.getElementById('stopList');

                // Délégation : la liste (plus d'un millier d'éléments) est régénérée à chaque recherche
                if (stopList) {
                    stopList.addEventListener('change', (e) => {
                        if (e.target.matches('input[type="checkbox"]')) this.handleStopSelection(e);
                    });
                }

                if (toggleButton && selector) {
                    toggleButton.addEventListener('click', () => {
                        AppState.isConfigOpen = !AppState.isConfigOpen;
                        selector.classList.toggle('hidden');
                        toggleButton.setAttribute('aria-expanded', String(AppState.isConfigOpen));
                        const icon = toggleButton.querySelector('i');
                        if (icon) icon.className = AppState.isConfigOpen ? 'fas fa-chevron-up' : 'fas fa-chevron-down';
                        if (AppState.isConfigOpen && searchInput) setTimeout(() => searchInput.focus(), 100);
                    });
                }

                if (searchInput) {
                    searchInput.addEventListener('input', (e) => {
                        AppState.searchQuery = e.target.value;
                        clearTimeout(this.searchTimer);
                        this.searchTimer = setTimeout(() => this.renderStopSelector(), CONFIG.SEARCH_DEBOUNCE_MS);
                    });
                }

                if (clearStorageButton) {
                    clearStorageButton.addEventListener('click', () => {
                        if (confirm('Êtes-vous sûr de vouloir effacer toutes vos données sauvegardées (arrêts et filtres) ?')) {
                            StorageManager.clear();
                            this.renderStopSelector();
                            this.transport.updateTransportWidgets();
                        }
                    });
                }
            }
        }

        class TransportManager {
            constructor(saved = {}) {
                this.cachedByStop = {};
                // Ne restaurer que le cache des arrêts encore sélectionnés
                for (const code of AppState.selectedStops) {
                    if (Array.isArray(saved.cachedData?.[code])) this.cachedByStop[code] = saved.cachedData[code];
                }
                // Un horodatage illisible ou situé dans le futur (horloge déréglée) bloquerait les requêtes
                const last = Number(saved.lastFetchTime);
                this.lastFetchTime = Number.isFinite(last) && last > 0 && last <= Date.now() ? last : 0;
                this.lastFailed = false;
                this.fetchInProgress = false;
                this.countdownInterval = null;
                this.displayInterval = null;
                this.openFilterStop = null;      // arrêt dont le panneau de filtres est ouvert
                this.onSelectionChange = null;   // appelé quand la sélection change depuis un widget
                this.onVisibilityChange = () => {
                    // Retour sur l'onglet : affichage à jour, et requête si le délai est écoulé
                    if (document.hidden) return;
                    this.refreshDisplays();
                    this.startCountdown();
                };
                const refreshBtn = document.getElementById('refreshBtn');
                if (refreshBtn) refreshBtn.addEventListener('click', () => this.forceRefresh());
            }

            start() {
                this.updateTransportWidgets();
                // Rafraîchit l'affichage (minutes restantes, passages écoulés) sans nouvelle requête
                this.displayInterval = setInterval(() => this.refreshDisplays(), CONFIG.REFRESH_INTERVALS.DISPLAY);
                document.addEventListener('visibilitychange', this.onVisibilityChange);
            }

            updateTransportWidgets() {
                const container = document.getElementById('transportGrid');
                if (!container) return;

                const refreshBar = document.getElementById('refreshBar');

                if (AppState.selectedStops.length === 0) {
                    this.stopCountdown();
                    container.innerHTML = '<div class="error" style="grid-column: 1/-1;">Aucun arrêt sélectionné. Configurez vos arrêts ci-dessus.</div>';
                    if (refreshBar) refreshBar.classList.add('hidden');
                    return;
                }
                if (refreshBar) refreshBar.classList.remove('hidden');

                // Seules les cartes nouvellement ajoutées rejouent l'animation d'apparition
                const previous = new Set(Array.from(container.querySelectorAll('.widget'), w => w.dataset.stopCode));

                container.innerHTML = AppState.selectedStops.map(stopCode => {
                    const { name: stopName, duplicate } = stopInfo(stopCode);
                    const name = Utils.escapeHtml(duplicate ? `${stopName} (n° ${stopCode})` : stopName);
                    const titleHtml = Utils.escapeHtml(stopName) + (duplicate ? ` <small class="stop-suffix">n° ${stopCode}</small>` : '');
                    return `
                        <article class="widget${previous.has(stopCode) ? '' : ' is-new'}" draggable="true" data-stop-code="${stopCode}">
                            <div class="widget-header">
                                <div class="drag-handle" role="button" tabindex="0"
                                     title="Maintenir pour déplacer (ou flèches du clavier)"
                                     aria-label="Déplacer l'arrêt ${name} (flèches du clavier)">
                                    <i class="fas fa-grip-vertical" aria-hidden="true"></i>
                                </div>
                                <h2 class="title">
                                    <i class="fas fa-bus" aria-hidden="true"></i> ${titleHtml}
                                </h2>
                                <div class="actions">
                                    <button class="filter-button" data-stop="${stopCode}"
                                            aria-expanded="false" aria-controls="filter-${stopCode}"
                                            aria-label="Filtrer les lignes de l'arrêt ${name}">
                                        <i class="fas fa-filter" aria-hidden="true"></i>
                                        <span>Filtrer</span>
                                    </button>
                                </div>
                            </div>
                            <div class="filter-panel" id="filter-${stopCode}">
                                <div class="filter-panel-header">
                                    <div class="filter-panel-title">
                                        <i class="fas fa-sliders-h" aria-hidden="true"></i> Filtres actifs
                                    </div>
                                    <button class="reset-filters-button" data-stop="${stopCode}"
                                            aria-label="Réinitialiser les filtres de l'arrêt ${name}">
                                        <i class="fas fa-redo" aria-hidden="true"></i>
                                        <span>Réinitialiser</span>
                                    </button>
                                </div>
                                <div class="filter-section">
                                    <div class="filter-section-title">Lignes disponibles</div>
                                    <div class="filter-tags" id="lines-${stopCode}">
                                        <div class="loading" style="font-size: 0.8em;">Chargement...</div>
                                    </div>
                                </div>
                                <div class="filter-section">
                                    <div class="filter-section-title">Destinations disponibles</div>
                                    <div class="filter-tags" id="destinations-${stopCode}">
                                        <div class="loading" style="font-size: 0.8em;">Chargement...</div>
                                    </div>
                                </div>
                            </div>
                            <div id="content-${stopCode}">
                                <div class="loading">Chargement...</div>
                            </div>
                            <div class="widget-footer">
                                <button class="remove-button" data-stop="${stopCode}"
                                        aria-label="Supprimer l'arrêt ${name}">
                                    <i class="fas fa-trash-alt" aria-hidden="true"></i>
                                    <span>Supprimer</span>
                                </button>
                            </div>
                        </article>
                    `;
                }).join('');

                container.querySelectorAll('.widget').forEach(widget => this.setupDragAndDrop(widget));

                container.querySelectorAll('.filter-button').forEach(button => {
                    button.addEventListener('click', (e) => {
                        this.toggleFilterPanel(e.currentTarget.dataset.stop);
                    });
                });

                container.querySelectorAll('.remove-button').forEach(button => {
                    button.addEventListener('click', (e) => this.removeStop(e.currentTarget.dataset.stop));
                });

                container.querySelectorAll('.reset-filters-button').forEach(button => {
                    button.addEventListener('click', (e) => this.resetFilters(e.currentTarget.dataset.stop));
                });

                // Délégation : les étiquettes de filtre sont régénérées à chaque mise à jour
                container.querySelectorAll('.filter-tags').forEach(group => {
                    group.addEventListener('click', (e) => this.handleTagEvent(e));
                    group.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') this.handleTagEvent(e);
                    });
                });

                AppState.selectedStops.forEach(stopCode => {
                    if (!AppState.filters[stopCode]) {
                        AppState.filters[stopCode] = { hiddenLines: [], hiddenDestinations: [] };
                    }
                });

                // Restaurer le cache immédiatement pour les arrêts existants
                for (const stopCode of AppState.selectedStops) {
                    if (this.cachedByStop[stopCode]) this.updateFilterOptions(stopCode, this.cachedByStop[stopCode]);
                }
                // Le panneau de filtres ouvert le reste après un nouveau rendu (déplacement, ajout...)
                this.setOpenFilterPanel(AppState.selectedStops.includes(this.openFilterStop) ? this.openFilterStop : null);
                this.refreshDisplays();

                // Le décompte pilote le cycle de requêtes (pas de timer séparé)
                this.startCountdown();
            }

            toggleFilterPanel(stopCode) {
                this.setOpenFilterPanel(this.openFilterStop === stopCode ? null : stopCode);
            }

            // Ouvre le panneau de filtres d'un arrêt (et ferme les autres) ; null = tout fermer
            setOpenFilterPanel(stopCode) {
                this.openFilterStop = stopCode;
                document.querySelectorAll('.filter-panel').forEach(panel => {
                    panel.classList.toggle('active', panel.id === `filter-${stopCode}`);
                });
                document.querySelectorAll('.filter-button').forEach(button => {
                    const isOpen = button.dataset.stop === stopCode;
                    button.classList.toggle('active', isOpen);
                    button.setAttribute('aria-expanded', String(isOpen));
                });
            }

            // ---------- Cycle de requêtes ----------

            secondsUntilNextFetch() {
                const elapsed = Math.floor((Date.now() - this.lastFetchTime) / 1000);
                return Math.max(0, CONFIG.FETCH_COOLDOWN_S - elapsed);
            }

            // `force` : réessai manuel après une erreur (ignore le délai de 30 s)
            async loadAllStopsData(force = false) {
                if (AppState.selectedStops.length === 0) return;
                if (this.fetchInProgress) return;

                // Respecter le rate limit : 1 requête / 30 s
                if (!force && Date.now() - this.lastFetchTime < (CONFIG.FETCH_COOLDOWN_S - 1) * 1000) return;

                // Arrêts concernés par cette requête : la sélection peut changer pendant l'attente
                const requested = [...AppState.selectedStops];

                // Collecter tous les QuayIds des arrêts demandés
                const quayIds = [];
                for (const stopCode of requested) {
                    const info = STOP_MAP[parseInt(stopCode, 10)];
                    if (info) quayIds.push(...info.quays);
                }
                if (quayIds.length === 0) return;

                this.fetchInProgress = true;
                const btn = document.getElementById('refreshBtn');
                const label = document.getElementById('refreshLabel');
                if (btn) { btn.classList.remove('ready'); btn.classList.add('fetching'); btn.disabled = true; }
                if (label) label.textContent = 'Chargement...';
                this.refreshDisplays();

                try {
                    const { ok, status, text } = await Utils.fetchText(CONFIG.SIRI_ENDPOINT, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: this.buildSiriRequest(quayIds)
                    }, 20000);

                    this.lastFetchTime = Date.now();

                    if (status === 429) {
                        // Trop de requêtes : on garde le cache et on réessaie au prochain cycle
                        console.warn('SIRI: rate limit, prochain cycle dans 30 s');
                    } else {
                        if (!ok) throw new Error(`HTTP ${status}`);

                        // Regrouper par arrêt (StopPlace ID), trié par heure de départ
                        const byStop = {};
                        for (const dep of this.parseSiriResponse(text)) {
                            if (dep.stopPlaceId) (byStop[dep.stopPlaceId] ||= []).push(dep);
                        }
                        for (const deps of Object.values(byStop)) {
                            deps.sort((a, b) => this.sortKey(a) - this.sortKey(b));
                        }

                        // Seuls les arrêts demandés ont une réponse : un arrêt ajouté pendant
                        // la requête attend le cycle suivant (sinon il afficherait « aucun passage »)
                        for (const stopCode of requested) {
                            if (!AppState.selectedStops.includes(stopCode)) continue;
                            const data = byStop[stopCode] || [];
                            this.cachedByStop[stopCode] = data;
                            this.updateFilterOptions(stopCode, data);
                        }
                        this.lastFailed = false;
                        StorageManager.save();
                    }
                } catch (error) {
                    // Nouvel essai automatique au prochain cycle (le bouton permet de forcer)
                    this.lastFetchTime = Date.now();
                    this.lastFailed = true;
                    console.error('Erreur SIRI:', error);
                } finally {
                    this.fetchInProgress = false;
                    if (btn) btn.classList.remove('fetching');
                }

                this.refreshDisplays();
                this.startCountdown();
            }

            buildSiriRequest(quayIds) {
                const ts = new Date().toISOString();
                const requests = quayIds.map((qid, i) =>
                    `<StopMonitoringRequest version="2.0"><RequestTimestamp>${ts}</RequestTimestamp><MessageIdentifier>Msg-${i}</MessageIdentifier><MonitoringRef>FR_NAOLIB:Quay:${qid}</MonitoringRef></StopMonitoringRequest>`
                ).join('');
                return `<?xml version="1.0" encoding="utf-8"?><Siri xmlns="http://www.siri.org.uk/siri" version="2.0"><ServiceRequest><RequestTimestamp>${ts}</RequestTimestamp><RequestorRef>opendata</RequestorRef>${requests}</ServiceRequest></Siri>`;
            }

            parseSiriResponse(xmlText) {
                const parser = new DOMParser();
                const doc = parser.parseFromString(xmlText, 'application/xml');
                if (doc.getElementsByTagName('parsererror').length > 0) {
                    throw new Error('Réponse SIRI illisible');
                }
                const ns = 'http://www.siri.org.uk/siri';
                const departures = [];

                const visits = doc.getElementsByTagNameNS(ns, 'MonitoredStopVisit');
                for (const visit of visits) {
                    const get = (tag) => visit.getElementsByTagNameNS(ns, tag)[0]?.textContent?.trim() || '';

                    const monRef = get('MonitoringRef');
                    const quayId = parseInt(monRef.split(':').pop(), 10);
                    const placeId = QUAY_TO_PLACE[quayId];

                    const lineRef = get('LineRef');
                    const lineNum = lineRef.replace(/^.*:Line:/, '').replace(/:LOC$/, '');

                    const destination = get('DestinationDisplay') || get('DestinationName');
                    const vehicleMode = get('VehicleMode');
                    const expectedDep = get('ExpectedDepartureTime') || get('AimedDepartureTime');
                    const aimedDep = get('AimedDepartureTime');
                    const status = get('DepartureStatus') || get('ArrivalStatus');

                    if (lineNum && destination && expectedDep) {
                        departures.push({
                            quayId,
                            stopPlaceId: placeId !== undefined ? String(placeId) : null,
                            line: lineNum,
                            destination,
                            vehicleMode,
                            expectedTime: expectedDep,
                            aimedTime: aimedDep,
                            expectedMs: Date.parse(expectedDep),   // lus une seule fois, pas à chaque seconde
                            aimedMs: Date.parse(aimedDep),
                            status,
                            cancelled: /cancel/i.test(status)
                        });
                    }
                }
                return departures;
            }

            // ---------- Compte à rebours et rafraîchissement ----------

            stopCountdown() {
                if (this.countdownInterval) {
                    clearInterval(this.countdownInterval);
                    this.countdownInterval = null;
                }
            }

            startCountdown() {
                if (this.fetchInProgress) return;
                const btn = document.getElementById('refreshBtn');
                const label = document.getElementById('refreshLabel');
                if (!btn || !label) return;
                this.stopCountdown();

                // Le temps restant est relu à chaque tick (robuste si l'onglet est ralenti)
                const tick = () => {
                    // Après une erreur, le bouton permet de forcer un nouvel essai (avec un délai minimal)
                    const canRetry = this.lastFailed && Date.now() - this.lastFetchTime >= CONFIG.MIN_MANUAL_RETRY_MS;
                    btn.disabled = !canRetry;
                    btn.classList.toggle('ready', canRetry);

                    const remaining = this.secondsUntilNextFetch();
                    if (remaining <= 0) {
                        // Onglet masqué : on ne sollicite pas l'API ; la requête part au retour
                        if (document.hidden) return;
                        this.stopCountdown();
                        this.loadAllStopsData();
                        return;
                    }
                    label.textContent = this.lastFailed ? `Réessai dans ${remaining}s` : `${remaining}s`;
                };
                tick();
                if (!this.fetchInProgress && (this.secondsUntilNextFetch() > 0 || document.hidden)) {
                    this.countdownInterval = setInterval(tick, 1000);
                }
            }

            forceRefresh() {
                if (this.fetchInProgress || !this.lastFailed) return;
                // Pas de rafale : au moins MIN_MANUAL_RETRY_MS après la dernière tentative
                if (Date.now() - this.lastFetchTime < CONFIG.MIN_MANUAL_RETRY_MS) return;
                this.loadAllStopsData(true);
            }

            // Redessine tous les arrêts depuis le cache (appelé chaque seconde)
            refreshDisplays() {
                if (document.hidden) return;   // inutile sur un onglet masqué ; refait au retour
                for (const stopCode of AppState.selectedStops) {
                    const data = this.cachedByStop[stopCode];
                    if (data) this.displayStopData(stopCode, data);
                    else this.displayPlaceholder(stopCode);
                }
            }

            // N'écrit dans le DOM que si le contenu a changé
            setContent(container, html) {
                if (container._html === html) return;
                container._html = html;
                container.innerHTML = html;
            }

            // Arrêt sans données en cache : on explique l'attente
            displayPlaceholder(stopCode) {
                const container = document.getElementById(`content-${stopCode}`);
                if (!container) return;
                const wait = this.secondsUntilNextFetch();
                let html;
                if (this.fetchInProgress || (!this.lastFailed && wait === 0)) {
                    html = '<div class="loading">Chargement...</div>';
                } else if (this.lastFailed) {
                    html = `<div class="error">Données indisponibles<small>Nouvel essai dans ${wait}s</small></div>`;
                } else {
                    html = `<div class="loading">Prochaine actualisation dans ${wait}s</div>`;
                }
                this.setContent(container, html);
            }

            // ---------- Filtres ----------

            // Calcule lignes, destinations et destinations masquées automatiquement
            // (une destination d'une ligne masquée est masquée avec elle)
            getFilterContext(stopCode, data) {
                const filters = AppState.filters[stopCode] || { hiddenLines: [], hiddenDestinations: [] };
                const lines = new Set();
                const destinations = new Set();
                const lineToDestinations = {};
                const destToLines = {};

                for (const bus of data) {
                    if (!bus) continue;
                    const ligne = this.getLigne(bus);
                    const terminus = this.getTerminus(bus);
                    const hasLine = ligne && ligne !== 'N/A';
                    const hasDest = terminus && terminus !== 'Direction inconnue';
                    if (hasLine) {
                        lines.add(ligne);
                        if (!lineToDestinations[ligne]) lineToDestinations[ligne] = new Set();
                        if (hasDest) {
                            lineToDestinations[ligne].add(terminus);
                            if (!destToLines[terminus]) destToLines[terminus] = new Set();
                            destToLines[terminus].add(ligne);
                        }
                    }
                    if (hasDest) destinations.add(terminus);
                }

                // Les éléments masqués restent listés même sans passage actuel,
                // pour pouvoir les réafficher
                filters.hiddenLines.forEach(l => lines.add(l));
                filters.hiddenDestinations.forEach(d => destinations.add(d));

                const autoHiddenDestinations = new Set();
                for (const hiddenLine of filters.hiddenLines) {
                    lineToDestinations[hiddenLine]?.forEach(dest => autoHiddenDestinations.add(dest));
                }

                return { filters, lines, destinations, destToLines, autoHiddenDestinations };
            }

            updateFilterOptions(stopCode, data) {
                if (!Array.isArray(data)) return;
                const { filters, lines, destinations, destToLines, autoHiddenDestinations } =
                    this.getFilterContext(stopCode, data);

                const linesContainer = document.getElementById(`lines-${stopCode}`);
                if (linesContainer) {
                    linesContainer.innerHTML = lines.size === 0
                        ? '<div class="filter-empty">Aucune ligne pour le moment</div>'
                        : Array.from(lines).sort(Utils.compareNatural).map(line => {
                            const isFiltered = filters.hiddenLines.includes(line);
                            const hue = this.getLineHue(line);
                            const safe = Utils.escapeHtml(line);
                            return `<div class="filter-tag line-tag ${isFiltered ? 'filtered' : ''}" style="border-left-color: hsl(${hue}, 85%, 55%);" role="button" tabindex="0" aria-label="${isFiltered ? 'Afficher' : 'Masquer'} la ligne ${safe}" data-type="line" data-stop="${stopCode}" data-value="${safe}">${isFiltered ? '<i class="fas fa-eye-slash" aria-hidden="true"></i>' : '<i class="fas fa-eye" aria-hidden="true"></i>'}<span style="${isFiltered ? '' : `color: hsl(${hue}, 85%, 65%); font-weight: 700;`}">${safe}</span></div>`;
                        }).join('');
                }

                const destContainer = document.getElementById(`destinations-${stopCode}`);
                if (destContainer) {
                    destContainer.innerHTML = destinations.size === 0
                        ? '<div class="filter-empty">Aucune destination pour le moment</div>'
                        : Array.from(destinations).sort((a, b) => a.localeCompare(b, CONFIG.LOCALE)).map(dest => {
                            const isManuallyFiltered = filters.hiddenDestinations.includes(dest);
                            const isAutoFiltered = autoHiddenDestinations.has(dest) && !isManuallyFiltered;
                            const isFiltered = isManuallyFiltered || isAutoFiltered;
                            const safe = Utils.escapeHtml(dest);
                            const lineBadges = Array.from(destToLines[dest] || []).sort(Utils.compareNatural).map(line => {
                                const hue = this.getLineHue(line);
                                return `<span class="line-mini-badge" style="background: hsla(${hue}, 85%, 55%, 0.2); color: hsl(${hue}, 85%, 65%);">${Utils.escapeHtml(line)}</span>`;
                            }).join('');
                            const a11y = isAutoFiltered
                                ? 'aria-disabled="true" title="Masqué automatiquement (ligne filtrée)"'
                                : `role="button" tabindex="0" aria-label="${isFiltered ? 'Afficher' : 'Masquer'} la destination ${safe}"`;
                            return `<div class="filter-tag ${isFiltered ? 'filtered' : ''} ${isAutoFiltered ? 'auto-filtered' : ''}" ${a11y} data-type="destination" data-stop="${stopCode}" data-value="${safe}">${isFiltered ? '<i class="fas fa-eye-slash" aria-hidden="true"></i>' : '<i class="fas fa-eye" aria-hidden="true"></i>'}${lineBadges}<span>${safe}</span>${isAutoFiltered ? '<i class="fas fa-link" aria-hidden="true" style="font-size: 0.6em; opacity: 0.7;"></i>' : ''}</div>`;
                        }).join('');
                }
            }

            handleTagEvent(event) {
                const tag = event.target.closest('.filter-tag');
                if (!tag || tag.classList.contains('auto-filtered')) return;
                event.preventDefault();
                this.toggleFilter(tag);
            }

            toggleFilter(tagElement) {
                const { type, stop: stopCode, value } = tagElement.dataset;

                if (!AppState.filters[stopCode]) {
                    AppState.filters[stopCode] = { hiddenLines: [], hiddenDestinations: [] };
                }

                const filterArray = type === 'line' ? AppState.filters[stopCode].hiddenLines : AppState.filters[stopCode].hiddenDestinations;
                const index = filterArray.indexOf(value);
                if (index > -1) filterArray.splice(index, 1);
                else filterArray.push(value);

                const hadFocus = document.activeElement === tagElement;
                StorageManager.save();
                this.rerenderStop(stopCode);

                // Les étiquettes sont régénérées : rendre le focus clavier à la même
                if (hadFocus) {
                    const group = document.getElementById(`${type === 'line' ? 'lines' : 'destinations'}-${stopCode}`);
                    Array.from(group?.querySelectorAll('.filter-tag') || [])
                        .find(t => t.dataset.value === value)?.focus();
                }
            }

            rerenderStop(stopCode) {
                const data = this.cachedByStop[stopCode];
                if (!data) return;
                this.updateFilterOptions(stopCode, data);
                this.displayStopData(stopCode, data);
            }

            resetFilters(stopCode) {
                if (AppState.filters[stopCode]) {
                    AppState.filters[stopCode] = { hiddenLines: [], hiddenDestinations: [] };
                }
                StorageManager.save();
                this.rerenderStop(stopCode);
            }

            // ---------- Sélection et ordre des arrêts ----------

            // Oublie les données d'un arrêt retiré (filtres + cache)
            forgetStop(stopCode) {
                delete AppState.filters[stopCode];
                delete this.cachedByStop[stopCode];
            }

            removeStop(stopCode) {
                AppState.selectedStops = AppState.selectedStops.filter(code => code !== stopCode);
                this.forgetStop(stopCode);
                StorageManager.save();
                this.updateTransportWidgets();
                if (this.onSelectionChange) this.onSelectionChange();
            }

            setupDragAndDrop(widget) {
                const dragHandle = widget.querySelector('.drag-handle');
                let isDragging = false;

                // Clavier : flèches sur la poignée pour déplacer l'arrêt
                dragHandle.addEventListener('keydown', (e) => {
                    const step = { ArrowUp: -1, ArrowLeft: -1, ArrowDown: 1, ArrowRight: 1 }[e.key];
                    if (!step) return;
                    e.preventDefault();
                    this.moveStop(widget.dataset.stopCode, step);
                });

                dragHandle.addEventListener('touchstart', () => {
                    isDragging = true;
                    widget.style.opacity = '0.5';
                }, { passive: true });

                dragHandle.addEventListener('touchmove', (e) => {
                    if (!isDragging) return;
                    const touch = e.touches[0];
                    const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
                    const widgetBelow = elementBelow?.closest('.widget');
                    if (widgetBelow && widgetBelow !== widget) {
                        widgetBelow.classList.add('drag-over');
                        document.querySelectorAll('.widget').forEach(w => {
                            if (w !== widgetBelow) w.classList.remove('drag-over');
                        });
                    }
                }, { passive: true });

                // Geste interrompu (appel, défilement système...) : rendre la carte à son état normal
                dragHandle.addEventListener('touchcancel', () => {
                    isDragging = false;
                    widget.style.opacity = '';
                    document.querySelectorAll('.widget.drag-over').forEach(w => w.classList.remove('drag-over'));
                }, { passive: true });

                dragHandle.addEventListener('touchend', (e) => {
                    if (!isDragging) return;
                    widget.style.opacity = '';
                    const touch = e.changedTouches[0];
                    const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
                    const widgetBelow = elementBelow?.closest('.widget');
                    document.querySelectorAll('.widget').forEach(w => w.classList.remove('drag-over'));
                    if (widgetBelow && widgetBelow !== widget) {
                        this.reorderStops(widget.dataset.stopCode, widgetBelow.dataset.stopCode);
                    }
                    isDragging = false;
                }, { passive: true });

                dragHandle.addEventListener('mousedown', () => { isDragging = true; });

                widget.addEventListener('mousedown', (e) => {
                    if (!e.target.closest('.drag-handle')) {
                        isDragging = false;
                        widget.setAttribute('draggable', 'false');
                    } else {
                        widget.setAttribute('draggable', 'true');
                    }
                });

                widget.addEventListener('dragstart', (e) => {
                    if (!isDragging) { e.preventDefault(); return; }
                    widget.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', widget.dataset.stopCode);
                });

                widget.addEventListener('dragend', () => {
                    widget.classList.remove('dragging');
                    document.querySelectorAll('.widget.drag-over').forEach(w => w.classList.remove('drag-over'));
                    isDragging = false;
                    widget.setAttribute('draggable', 'true');
                });

                widget.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    const draggingWidget = document.querySelector('.dragging');
                    if (draggingWidget && draggingWidget !== widget) widget.classList.add('drag-over');
                });

                widget.addEventListener('dragleave', () => widget.classList.remove('drag-over'));

                widget.addEventListener('drop', (e) => {
                    e.preventDefault();
                    widget.classList.remove('drag-over');
                    const draggedStopCode = e.dataTransfer.getData('text/plain');
                    const targetStopCode = widget.dataset.stopCode;
                    if (draggedStopCode !== targetStopCode) this.reorderStops(draggedStopCode, targetStopCode);
                });
            }

            reorderStops(draggedCode, targetCode) {
                const draggedIndex = AppState.selectedStops.indexOf(draggedCode);
                const targetIndex = AppState.selectedStops.indexOf(targetCode);
                if (draggedIndex === -1 || targetIndex === -1) return;
                AppState.selectedStops.splice(draggedIndex, 1);
                const newTargetIndex = AppState.selectedStops.indexOf(targetCode);
                AppState.selectedStops.splice(newTargetIndex, 0, draggedCode);
                StorageManager.save();
                this.updateTransportWidgets();
            }

            // Déplacement d'un cran (clavier) ; rend le focus à la poignée après le rendu
            moveStop(stopCode, step) {
                const index = AppState.selectedStops.indexOf(stopCode);
                const newIndex = index + step;
